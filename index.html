<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DJI Multi-Cam Remote</title>
<style>
  :root { --bg:#111418; --card:#1c2128; --line:#2d333b; --txt:#e6edf3; --mut:#8b949e; --ok:#2ea043; --rec:#e5484d; --acc:#2f81f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 -apple-system,system-ui,sans-serif; padding:14px; padding-bottom:40px; }
  h1 { font-size:20px; margin:4px 0 2px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:14px; }
  .all { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  button { font:inherit; border:0; border-radius:12px; padding:14px 10px; color:#fff; background:#30363d; }
  button:active { opacity:.7; }
  button:disabled { opacity:.35; }
  .start { background:var(--ok); } .stop { background:var(--rec); } .conn { background:var(--acc); }
  .big { font-size:18px; font-weight:600; padding:18px 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .name { font-weight:600; font-size:17px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:20px; background:#30363d; color:var(--mut); }
  .chip.ok { background:#16351f; color:#56d364; } .chip.rec { background:#4a1d1f; color:#ff7b72; } .chip.wait { background:#3b2f10; color:#e3b341; }
  .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px; }
  details { margin-top:14px; } summary { color:var(--mut); padding:6px 0; }
  #log { background:#0b0e12; border:1px solid var(--line); border-radius:10px; padding:8px; height:240px; overflow:auto; font:11px/1.35 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-all; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 3px; }
  select,input { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0b0e12; color:var(--txt); font:inherit; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .small { padding:10px 6px; font-size:14px; }
  .warn { background:#3b2f10; color:#e3b341; border-radius:10px; padding:10px; font-size:13px; margin-bottom:12px; display:none; }
</style>
</head>
<body>
<h1>DJI Multi-Cam Remote</h1>
<div class="sub">Bis zu 4 Kameras per Bluetooth starten und stoppen</div>
<div class="warn" id="nobt">Dieser Browser unterstützt kein Web-Bluetooth. Bitte diese Seite in der App „Bluefy" öffnen.</div>

<div class="all">
  <button class="big start" id="allStart">● Alle starten</button>
  <button class="big stop" id="allStop">■ Alle stoppen</button>
</div>

<div id="banner" class="warn" style="display:none;font-size:17px;text-align:center"></div>

<button id="cancelFinder" class="small stop" style="display:none;width:100%;margin-bottom:12px">Test abbrechen</button>

<div id="cams"></div>

<details open>
  <summary>Protokoll &amp; Test-Konsole</summary>
  <div id="log"></div>
  <div class="g2">
    <button id="copyLog" class="small">Protokoll kopieren</button>
    <button id="clearLog" class="small">Leeren</button>
  </div>

  <label>Test-Befehl an Kamera senden (Hex: Empfänger, Typ, Set, ID, Daten …)</label>
  <input id="probe" value="01 40 02 02" autocapitalize="off" autocomplete="off" autocorrect="off">
  <div class="g2">
    <select id="probeCam"><option value="1">Kamera 1</option><option value="2">Kamera 2</option><option value="3">Kamera 3</option><option value="4">Kamera 4</option></select>
    <button id="probeSend" class="small conn">Senden</button>
  </div>
  <div class="g2">
    <button id="p1" class="small">Video-Start 02 02 01</button>
    <button id="p2" class="small">Kandidat 02 02 02</button>
    <button id="p3" class="small">Kandidat 02 02 03</button>
    <button id="pPair" class="small">Pairing senden</button>
    <button id="finder" class="small start" style="grid-column:1 / span 2">▶ Aufnahme-Finder (6 Schritte, ca. 1 Min.)</button>
    <button id="stopfinder" class="small stop" style="grid-column:1 / span 2">■ Stopp-Finder (startet erst, dann 5 Stopp-Kandidaten, ca. 1,5 Min.)</button>
    <button id="auto" class="small conn" style="grid-column:1 / span 2">Auto-Test: 15 Foto-/Aufnahme-Befehle nacheinander</button>
    <button id="saveStart" class="small start">Als „Start" speichern</button>
    <button id="saveStop" class="small stop">Als „Stopp" speichern</button>
  </div>
  <label>Aktueller Start-Befehl</label><input id="cmdStart" autocapitalize="off" autocomplete="off">
  <label>Aktueller Stopp-Befehl</label><input id="cmdStop" autocapitalize="off" autocomplete="off">
  <label>Pairing-PIN</label><input id="pin" autocapitalize="off" autocomplete="off">
</details>

<script>
"use strict";
const APP_VERSION = "v8 (2026-10-26 09:20, Stopp-Finder)";
const NUM_CAMS = 4;
const SVC = "0000fff0-0000-1000-8000-00805f9b34fb";
const CH_A = "0000fff4-0000-1000-8000-00805f9b34fb";
const CH_W = "0000fff5-0000-1000-8000-00805f9b34fb";
const $ = id => document.getElementById(id);
const hex = a => Array.from(a).map(b => b.toString(16).padStart(2,"0")).join(" ").toUpperCase();
const parseHex = s => { const h = s.replace(/[^0-9a-f]/gi, ""); const o = []; for (let i = 0; i + 1 < h.length; i += 2) o.push(parseInt(h.substr(i,2),16)); return o; };

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
$("cmdStart").value = store.get("cmdStart3", "01 40 02 02 01");
$("cmdStop").value  = store.get("cmdStop3", "01 40 02 02 02");
$("pin").value      = store.get("pin", "love");
$("pin").onchange = () => store.set("pin", $("pin").value);
$("cmdStart").onchange = () => store.set("cmdStart3", $("cmdStart").value);
$("cmdStop").onchange  = () => store.set("cmdStop3",  $("cmdStop").value);

let devStr = store.get("devStr", "");
if (!/^\d{15}$/.test(devStr)) { devStr = "00"; for (let i = 0; i < 13; i++) devStr += Math.floor(Math.random()*10); store.set("devStr", devStr); }

function log(msg){
  const t = new Date().toLocaleTimeString("de-DE");
  const el = $("log"); el.textContent += `[${t}] ${msg}\n`; el.scrollTop = el.scrollHeight;
}
$("clearLog").onclick = () => $("log").textContent = "";
$("copyLog").onclick = async () => {
  try { await navigator.clipboard.writeText($("log").textContent); log("Protokoll kopiert."); }
  catch(e){ log("Kopieren nicht möglich – Text bitte markieren."); }
};

// ---------- DUML (Prüfsummen anhand echter Kamera-Frames bestätigt) ----------
function crc8(d){ let c = 0x77; for (const b of d){ c ^= b; for (let i=0;i<8;i++) c = (c & 1) ? (c >>> 1) ^ 0x8C : c >>> 1; } return c & 0xFF; }
function crc16(d){ let c = 0x3692; for (const b of d){ c ^= b; for (let i=0;i<8;i++) c = (c & 1) ? (c >>> 1) ^ 0x8408 : c >>> 1; } return c & 0xFFFF; }

function buildDuml(sender, receiver, seq, type, set, id, payload){
  const len = 13 + payload.length;
  const f = new Uint8Array(len);
  f[0] = 0x55; f[1] = len & 0xFF; f[2] = ((len >> 8) & 0x03) | 0x04;
  f[3] = crc8(f.subarray(0, 3));
  f[4] = sender; f[5] = receiver; f[6] = seq & 0xFF; f[7] = (seq >> 8) & 0xFF;
  f[8] = type; f[9] = set; f[10] = id;
  f.set(payload, 11);
  const c = crc16(f.subarray(0, len - 2)); f[len-2] = c & 0xFF; f[len-1] = c >> 8;
  return f;
}
function selfTest(){
  // 1) Beispiel aus der Fachliteratur (Pairing-Frame)
  const pl = [15, ...Array.from("001749319286102").map(ch => ch.charCodeAt(0)), 4, ...Array.from("5160").map(ch => ch.charCodeAt(0))];
  const f = buildDuml(0x02, 0x07, 0x9280, 0x40, 0x07, 0x45, pl);
  const ok1 = hex(f).replace(/ /g,"") === "552204EA020780924007450F303031373439333139323836313032043531363" + "02E42";
  // 2) echter Frame deiner Kamera: Länge, CRC8 und CRC16
  const real = parseHex("55 44 04 1A 88 02 30 03 00 00 32 33 33 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 01 0E 34 46 33 43 4A 42 39 30 30 41 42 47 51 42 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 D7 F9");
  const ok2 = crc8(real.slice(0,3)) === real[3] && crc16(real.slice(0, real.length-2)) === (real[real.length-2] | (real[real.length-1] << 8));
  log(`Selbsttest: Beispiel-Frame ${ok1 ? "OK" : "FEHLER"}, echter Kamera-Frame ${ok2 ? "OK" : "FEHLER"}`);
}

// ---------- Kameras ----------
const cams = [];
for (let i = 0; i < NUM_CAMS; i++) cams.push({ n:i+1, device:null, wr:null, seq:Math.floor(Math.random()*60000), buf:[], ready:false, recording:false });

function render(){
  cams.forEach(c => {
    const chip = $("chip"+c.n);
    let txt = "Nicht verbunden", cls = "chip";
    if (c.ready){ txt = "Verbunden"; cls = "chip ok"; }
    else if (c.device){ txt = "Verbinde…"; cls = "chip wait"; }
    chip.textContent = txt; chip.className = cls;
    $("start"+c.n).disabled = !c.ready; $("stop"+c.n).disabled = !c.ready;
    $("conn"+c.n).textContent = c.device ? "Trennen" : "Verbinden";
  });
}
cams.forEach(c => {
  const d = document.createElement("div"); d.className = "card";
  d.innerHTML = `<div class="row"><span class="name">Kamera ${c.n}</span><span class="chip" id="chip${c.n}"></span></div>
    <div class="btns">
      <button class="conn" id="conn${c.n}">Verbinden</button>
      <button class="start" id="start${c.n}">● Start</button>
      <button class="stop" id="stop${c.n}">■ Stopp</button>
    </div>`;
  $("cams").appendChild(d);
  $("conn"+c.n).onclick = () => c.device ? disconnect(c) : connect(c);
  $("start"+c.n).onclick = () => runCmd(c, $("cmdStart").value);
  $("stop"+c.n).onclick = () => runCmd(c, $("cmdStop").value);
});

async function writeRaw(c, frame){
  for (let i = 0; i < frame.length; i += 20){
    const chunk = frame.slice(i, i + 20);
    if (c.wr.properties.writeWithoutResponse) await c.wr.writeValueWithoutResponse(chunk);
    else await c.wr.writeValueWithResponse(chunk);
  }
  log(`K${c.n} TX: ${hex(frame)}`);
}
const nextSeq = c => (c.seq = (c.seq + 1) & 0xFFFF);

// Befehl im Format: Empfänger Typ Set ID [Daten…]
async function runCmd(c, str){
  const b = parseHex(str);
  if (b.length < 4){ log("Befehl zu kurz (mind. 4 Bytes: Empfänger Typ Set ID)."); return; }
  if (!c.ready){ log(`K${c.n}: Nicht verbunden.`); return; }
  try { await writeRaw(c, buildDuml(0x02, b[0], nextSeq(c), b[1], b[2], b[3], b.slice(4))); }
  catch(e){ log(`K${c.n}: Senden fehlgeschlagen – ${e.name || ""} ${e.message || e}`); }
}
async function sendPairing(c){
  const pin = Array.from($("pin").value).map(ch => ch.charCodeAt(0));
  const dev = Array.from(devStr).map(ch => ch.charCodeAt(0));
  const payload = [dev.length, ...dev, pin.length, ...pin];
  try { await writeRaw(c, buildDuml(0x02, 0x07, nextSeq(c), 0x40, 0x07, 0x45, payload)); log(`K${c.n}: Pairing gesendet – bitte Kamerabildschirm beachten.`); }
  catch(e){ log(`K${c.n}: Pairing fehlgeschlagen – ${e.name || ""} ${e.message || e}`); }
}

async function connect(c){
  if (!navigator.bluetooth){ $("nobt").style.display = "block"; return; }
  try {
    log(`K${c.n}: Suche Kamera… (Eintrag „DJIAction-…“ wählen)`);
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[SVC] });
    if (cams.some(o => o !== c && o.device && o.device.id === dev.id)){ log(`K${c.n}: Diese Kamera ist schon in einem anderen Slot.`); return; }
    c.device = dev; c.ready = false; c.buf = []; render();
    dev.addEventListener("gattserverdisconnected", () => { log(`K${c.n}: Verbindung getrennt.`); reset(c); });
    const server = await dev.gatt.connect();
    log(`K${c.n}: Bluetooth verbunden mit „${dev.name || "unbekannt"}"`);
    const svc = await server.getPrimaryService(SVC);
    const ca = await svc.getCharacteristic(CH_A);
    c.wr = await svc.getCharacteristic(CH_W);
    const handler = e => onData(c, new Uint8Array(e.target.value.buffer));
    ca.addEventListener("characteristicvaluechanged", handler);
    c.wr.addEventListener("characteristicvaluechanged", handler);
    try { await ca.startNotifications(); } catch(e){ log(`K${c.n}: Notify FFF4: ${e.message || e}`); }
    try { await c.wr.startNotifications(); } catch(e){ log(`K${c.n}: Notify FFF5: ${e.message || e}`); }
    c.ready = true; render();
    log(`K${c.n}: Kanäle bereit.`);
    await sendPairing(c);
  } catch(e){
    log(`K${c.n}: Fehler – ${e.name || ""} ${e.message || e}`);
    if (c.device && c.device.gatt && c.device.gatt.connected) c.device.gatt.disconnect(); else reset(c);
  }
}
function reset(c){ c.device = null; c.wr = null; c.ready = false; c.recording = false; c.statusSeen = false; c.pairSeen = false; render(); }
function disconnect(c){ try { c.device.gatt.disconnect(); } catch(e){} reset(c); }

// ---------- Empfang ----------
function onData(c, chunk){
  c.buf.push(...chunk);
  for (;;){
    // zu einem gültigen Frame-Anfang vorspulen
    while (c.buf.length >= 4){
      if (c.buf[0] === 0x55 && (c.buf[2] >> 2) === 1 && crc8(c.buf.slice(0,3)) === c.buf[3]) break;
      c.buf.shift();
    }
    if (c.buf.length < 4) return;
    const len = c.buf[1] | ((c.buf[2] & 0x03) << 8);
    if (len < 13){ c.buf.shift(); continue; }
    if (c.buf.length < len) return;
    const f = Uint8Array.from(c.buf.splice(0, len));
    const good = crc16(f.subarray(0, len-2)) === (f[len-2] | (f[len-1] << 8));
    const seq = f[6] | (f[7] << 8);
    const payload = f.slice(11, len-2);
    if (f[4] === 0x88 && f[8] === 0x00 && f[9] === 0x00 && f[10] === 0x32){
      // Sekündliche Status-Meldung der Kamera: nur einmal anzeigen, damit echte Antworten sichtbar bleiben
      if (!c.statusSeen){ c.statusSeen = true; log(`K${c.n} RX: Kamera sendet sekündlich Statusmeldungen (werden ab jetzt nicht mehr einzeln angezeigt).`); }
      continue;
    }
    if (f[4] === 0x07 && f[8] === 0x40 && f[9] === 0x07 && f[10] === 0x46){
      if (!c.pairSeen){ c.pairSeen = true; log(`K${c.n} RX: Kamera sendet sekündlich Kopplungs-Meldung 07/46 (wird nicht mehr einzeln angezeigt).`); }
      continue;
    }
    log(`K${c.n} RX: von ${f[4].toString(16)} an ${f[5].toString(16)} typ ${f[8].toString(16)} set ${f[9].toString(16)} id ${f[10].toString(16)} seq ${seq} daten[${payload.length}] ${hex(payload.slice(0,24))}${payload.length>24?" …":""}${good?"":"  (CRC?)"}${(f[8]===0xC0 && payload.length===1) ? (payload[0]===0 ? "  ✓ ANGENOMMEN" : "  ✗ abgelehnt") : ""}`);
  }
}

// ---------- Test-Konsole ----------
$("p1").onclick = () => $("probe").value = "01 40 02 02 01";
$("p2").onclick = () => $("probe").value = "01 40 02 02 02";
$("p3").onclick = () => $("probe").value = "01 40 02 02 03";
$("pPair").onclick = () => sendPairing(cams[+$("probeCam").value - 1]);
let finderRunning = false;
$("finder").onclick = async () => {
  if (finderRunning) return;
  const c = cams[+$("probeCam").value - 1];
  if (!c.ready){ log(`K${c.n}: Nicht verbunden.`); return; }
  finderRunning = true; $("finder").disabled = true;
  const steps = [[2,2,2],[2,2,3],[2,2,1],[2,1,1],[2,1,2],[2,1,3]];
  const b = $("banner"); b.style.display = "block";
  log("=== AUFNAHME-FINDER START: Kamera im Videomodus, nichts läuft. Merke dir, bei welchem SCHRITT sie startet bzw. stoppt ===");
  for (let i = 0; i < steps.length; i++){
    const [st,id,d] = steps[i];
    log(`=== SCHRITT ${i+1}/${steps.length}: Befehl ${hex([st,id,d])} ===`);
    await runCmd(c, hex([0x01,0x40,st,id,d]));
    for (let t = 10; t > 0; t--){
      b.textContent = `Schritt ${i+1}/${steps.length} gesendet – Kamera beobachten (${t} s)`;
      await new Promise(r => setTimeout(r, 1000));
    }
  }
  b.style.display = "none";
  log("=== AUFNAHME-FINDER ENDE ===");
  finderRunning = false; $("finder").disabled = false;
};
let cancelFinder = false, stopFinderRunning = false;
$("cancelFinder").onclick = () => { cancelFinder = true; log("Test wird abgebrochen …"); };
const waitSec = async (sec, label, b) => { for (let t = sec; t > 0 && !cancelFinder; t--){ b.textContent = `${label} (${t} s)`; await new Promise(r => setTimeout(r, 1000)); } };
$("stopfinder").onclick = async () => {
  if (stopFinderRunning || finderRunning) return;
  const c = cams[+$("probeCam").value - 1];
  if (!c.ready){ log(`K${c.n}: Nicht verbunden.`); return; }
  stopFinderRunning = true; cancelFinder = false; $("stopfinder").disabled = true;
  const b = $("banner"); b.style.display = "block"; $("cancelFinder").style.display = "block";
  log("=== STOPP-FINDER START: Kamera im Videomodus, nichts läuft ===");
  log("=== START-BEFEHL 02 02 01 ===");
  await runCmd(c, "01 40 02 02 01");
  await waitSec(15, "Aufnahme sollte jetzt laufen", b);
  const steps = [[2,2,2],[2,2,3],[2,3,1],[2,3,0],[2,2,1]];
  for (let i = 0; i < steps.length && !cancelFinder; i++){
    log(`=== STOPP-KANDIDAT ${i+1}/${steps.length}: Befehl ${hex(steps[i])} ===`);
    await runCmd(c, hex([0x01,0x40,...steps[i]]));
    await waitSec(10, `Kandidat ${i+1}/${steps.length} gesendet – läuft die Aufnahme noch?`, b);
  }
  b.style.display = "none"; $("cancelFinder").style.display = "none";
  log(cancelFinder ? "=== STOPP-FINDER ABGEBROCHEN ===" : "=== STOPP-FINDER ENDE ===");
  stopFinderRunning = false; $("stopfinder").disabled = false;
};
let autoRunning = false;
$("auto").onclick = async () => {
  if (autoRunning) return;
  const c = cams[+$("probeCam").value - 1];
  if (!c.ready){ log(`K${c.n}: Nicht verbunden.`); return; }
  autoRunning = true; $("auto").disabled = true;
  const payloads = [[], [0], [1], [2], [3]];
  let n = 0;
  log("=== AUTO-TEST START (jeweils ca. 3 Sekunden Pause) – bitte Kamera beobachten ===");
  for (const id of [1, 2, 3]){
    for (const pl of payloads){
      n++;
      if (!c.ready) break;
      log(`--- TEST ${n}/15: Set 02, ID ${id.toString(16).padStart(2,"0")}, Daten: ${pl.length ? hex(pl) : "keine"}`);
      await runCmd(c, hex([0x01, 0x40, 0x02, id, ...pl]));
      await new Promise(r => setTimeout(r, 3000));
    }
  }
  log("=== AUTO-TEST ENDE ===");
  autoRunning = false; $("auto").disabled = false;
};
$("probeSend").onclick = () => runCmd(cams[+$("probeCam").value - 1], $("probe").value);
$("saveStart").onclick = () => { $("cmdStart").value = $("probe").value; store.set("cmdStart3", $("probe").value); log("Start-Befehl gespeichert."); };
$("saveStop").onclick  = () => { $("cmdStop").value = $("probe").value; store.set("cmdStop3", $("probe").value); log("Stopp-Befehl gespeichert."); };
$("allStart").onclick = () => Promise.all(cams.filter(c => c.ready).map(c => runCmd(c, $("cmdStart").value)));
$("allStop").onclick  = () => Promise.all(cams.filter(c => c.ready).map(c => runCmd(c, $("cmdStop").value)));

if (!navigator.bluetooth) $("nobt").style.display = "block";
render();
log("Version " + APP_VERSION);
selfTest();
log("Bereit. Kamera einschalten, dann „Verbinden“ tippen.");
</script>
</body>
</html>
